name: Mobile builds

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: mobile-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'v2' || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: flutter pub get
      - name: Restore persistent Android signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/camera-assistant.jks"
      - name: Build signed Android release
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/camera-assistant.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: camera_assistant
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Build Android pull-request validation
        if: github.event_name == 'pull_request'
        run: |
          flutter build apk --debug
          flutter build appbundle --debug
      - name: Stage directly downloadable APK
        if: github.event_name != 'pull_request'
        run: cp build/app/outputs/flutter-apk/app-release.apk camera-assistant-v2.apk
      - name: Upload installable Android APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: camera-assistant-v2.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android App Bundle artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'v2' || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign
      - name: Package iOS simulator application
        if: github.event_name != 'pull_request'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app camera-assistant-v2-ios-simulator.zip
      - name: Upload iOS simulator artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-application
          path: camera-assistant-v2-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'v2' || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: flutter pub get
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline integration journeys on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test -d emulator-5554

  publish-prerelease:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/v2') || github.event_name == 'schedule'
    needs: [android, ios, android-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-application
          path: release-assets
      - name: Publish rolling v2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view continuous-v2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create continuous-v2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Latest v2 test build" --notes "Continuously updated Android and iOS simulator test builds from branch v2. Android is persistently signed; iOS is an unsigned simulator archive."
          gh release edit continuous-v2 --repo "$GITHUB_REPOSITORY" --prerelease --title "Latest v2 test build" --notes "Continuously updated Android and iOS simulator test builds from branch v2. Android is persistently signed; iOS is an unsigned simulator archive."
          gh release upload continuous-v2 release-assets/camera-assistant-v2.apk release-assets/camera-assistant-v2-ios-simulator.zip --repo "$GITHUB_REPOSITORY" --clobber
