name: Mobile builds

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: mobile-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'v2' || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: flutter pub get
      - name: Restore persistent Android signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/camera-assistant.jks"
      - name: Build signed Android release
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/camera-assistant.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: camera_assistant
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Build Android pull-request validation
        if: github.event_name == 'pull_request'
        run: |
          flutter build apk --debug
          flutter build appbundle --debug
      - name: Stage directly downloadable APK
        if: github.event_name != 'pull_request'
        run: cp build/app/outputs/flutter-apk/app-release.apk camera-assistant-v2.apk
      - name: Verify the merged release manifest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          "$aapt2" dump xmltree --file AndroidManifest.xml camera-assistant-v2.apk > "$RUNNER_TEMP/manifest.xml"
          for permission in RECORD_AUDIO WRITE_EXTERNAL_STORAGE; do
            if grep -q "android.permission.$permission" "$RUNNER_TEMP/manifest.xml"; then
              echo "::error::$permission must not appear in the release manifest (FR-017)"
              exit 1
            fi
          done
          # aapt2 prints features as either `uses-feature-not-required:'name'`
          # or `uses-feature-not-required: name='name'` depending on the
          # build-tools version, so normalise the spacing instead of betting on
          # one format (the previous pattern only matched the older aapt).
          "$aapt2" dump badging camera-assistant-v2.apk | tr -d ' ' > "$RUNNER_TEMP/badging.txt"
          echo 'Camera features in the merged release manifest:'
          grep -i 'camera' "$RUNNER_TEMP/badging.txt" || true
          if ! grep -Eq "uses-feature-not-required:(name=)?'android\.hardware\.camera\.any'" "$RUNNER_TEMP/badging.txt"; then
            echo '::error::android.hardware.camera.any must be declared not required so camera-less devices stay installable (FR-012)'
            exit 1
          fi
      - name: Keep the built APK when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-unverified
          path: camera-assistant-v2.apk
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload installable Android APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: camera-assistant-v2.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android App Bundle artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'v2' || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign
      - name: Package iOS simulator application
        if: github.event_name != 'pull_request'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app camera-assistant-v2-ios-simulator.zip
      - name: Upload iOS simulator artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-application
          path: camera-assistant-v2-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  android-integration:
    # Cross-platform signal, not a gate: the job is `continue-on-error` and
    # boots the app eight times on an emulator, so it runs on the nightly
    # schedule and on demand instead of holding every push for ~30 minutes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Building the debug APK takes ~5 minutes on the runner and each of the
    # eight journeys boots its own app; 20 minutes was not enough once the loop
    # below actually started running them.
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'v2' || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: flutter pub get
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline integration journeys on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # One file per invocation: a single `flutter test integration_test`
          # run shares one app launch across files, which has failed to start
          # the second app on some runners. Each file is self-contained.
          #
          # The action hands every line of `script` to `sh -c` separately, so
          # the loop has to be one line — the previous multi-line `for … done`
          # died with `Syntax error: end of file unexpected (expecting "done")`
          # before running a single journey.
          script: |
            for file in integration_test/*_test.dart; do echo "::group::$file"; flutter test "$file" -d emulator-5554 || exit 1; echo "::endgroup::"; done

  ios-integration:
    # Nightly and on demand for the same reason as the Android emulator job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'v2' || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: flutter pub get
      - name: Select and boot an available iOS simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"].values.flatten; phone = devices.find { |device| device["name"].start_with?("iPhone") }; abort "No available iPhone simulator" unless phone; puts phone["udid"]')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: Run offline integration journeys on iOS
        run: |
          set -e
          for file in integration_test/*_test.dart; do
            echo "::group::$file"
            flutter test "$file" -d "${{ steps.simulator.outputs.udid }}"
            echo "::endgroup::"
          done

  publish-prerelease:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/v2') || github.event_name == 'schedule'
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-application
          path: release-assets
      - name: Publish rolling v2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view continuous-v2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/continuous-v2" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create continuous-v2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Latest v2 test build" --notes "Continuously updated Android and iOS simulator test builds from branch v2. Android is persistently signed; iOS is an unsigned simulator archive."
          fi
          gh release edit continuous-v2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Latest v2 test build" --notes "Continuously updated Android and iOS simulator test builds from branch v2. Android is persistently signed; iOS is an unsigned simulator archive."
          gh release upload continuous-v2 release-assets/camera-assistant-v2.apk release-assets/camera-assistant-v2-ios-simulator.zip --repo "$GITHUB_REPOSITORY" --clobber
