name: photography_assistant
description: Offline-first photographic calculation and planning assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.41.0 <4.0.0'

dependencies:
  camera: ^0.12.0+2
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_compass: ^0.8.1
  geolocator: ^14.0.3
  intl: ^0.20.3
  timezone: ^0.10.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
